name: Scrape latest data

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scheduled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest event hash and data
        id: fetch
        run: bash .github/workflows/scripts/fetch_events.sh

      - name: Build canonical data.json
        if: steps.fetch.outputs.skip != 'true'
        run: |
          python3 .github/workflows/scripts/build_data.py eventmap.json data.json

      - name: Commit and push if it changed
        if: steps.fetch.outputs.skip != 'true'
        run: |
          git config user.name "event-detector"
          git config user.email "actions@users.noreply.github.com"
          git add data.json eventmap.json
          timestamp=$(date -u)
          git commit -m "Latest data as of ${timestamp}" || exit 0
          git push
